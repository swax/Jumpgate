<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumpgate Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1e1e1e; color: #ccc; font-family: sans-serif; }
    #toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: #2d2d2d;
      border-bottom: 1px solid #444;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      z-index: 100;
    }
    #toolbar button {
      padding: 6px 14px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #3a3d41;
      color: #ccc;
      cursor: pointer;
      font-size: 13px;
    }
    #toolbar button:hover { background: #505357; }
    #toolbar .title { font-size: 14px; font-weight: bold; margin-right: auto; }
    #toolbar .filename { font-size: 12px; color: #888; }
    #editor-container {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
    }
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 100, 200, 0.15);
      border: 3px dashed #4488ff;
      z-index: 200;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #4488ff;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="title">Jumpgate Demo</span>
    <span id="filename" class="filename"></span>
    <button id="open-btn">Open .jg File</button>
    <button id="save-btn">Save</button>
    <button id="new-btn">New</button>
  </div>
  <div id="editor-container"></div>
  <div id="drop-overlay">Drop .jg file here</div>
  <input type="file" id="file-input" accept=".jg" style="display:none">
  <script src="demo.js"></script>
</body>
</html>
